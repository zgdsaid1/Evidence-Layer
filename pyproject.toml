[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-layer"
version = "0.1.0"
description = "Provider-agnostic evidence-selection and context-reduction layer (Phase 1: evaluation foundation)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Evidence Layer contributors" }]
dependencies = [
    "pydantic>=2.0,<3",
    "mcp>=2.3.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27,<1",
]
jev = [
    "typesafe-sdk==0.7.2",
]
service = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "PyJWT[crypto]>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidence_layer = ["retrieval/_fixtures/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "services/evidence-service"]
